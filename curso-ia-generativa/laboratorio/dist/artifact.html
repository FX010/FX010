<title>Laboratorio Neuronal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Laboratorio Neuronal: composición. Barra superior fija, navegación de lecciones a la izquierda,
   lección en el centro y consola acoplada abajo. Un solo acento (cobalto) y ámbar como contraste. */
:root {
  --bg: #F3F5FB; --surface: #FFFFFF; --surface2: #E8ECF7; --ink: #131A33; --muted: #5B6585; --line: #D6DCEC;
  --accent: #3256F0; --accent-ink: #FFFFFF; --accent-soft: #E3E9FF; --amber: #A55F00; --good: #0B8A5F; --good-soft: #DDF4EA; --bad: #C93A55; --bad-soft: #FBE3E8;
  --code-bg: #101831; --code-ink: #E6EBFA; --code-muted: #7D89B3; --code-kw: #8FB0FF; --code-str: #9BE0B8; --code-num: #FFC370; --code-fn: #C8A8FF; --code-line: #25305A;
  --c1: #3256F0; --c2: #D98200; --c3: #0B8A5F; --c4: #C93A55;
  --shadow: 0 1px 2px rgba(19,26,51,.06), 0 6px 20px rgba(19,26,51,.06);
  --font-head: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --topbar-h: 56px; --dock-h: 0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1122; --surface: #131B33; --surface2: #1B2547; --ink: #E7ECFB; --muted: #9AA6CB; --line: #27325A;
    --accent: #7C98FF; --accent-ink: #0B1122; --accent-soft: #1F2C5E; --amber: #FFB649; --good: #44D7A5; --good-soft: #12342F; --bad: #FF7A90; --bad-soft: #3A1B28;
    --code-bg: #0A0F20; --code-line: #1E2748;
    --c1: #7C98FF; --c2: #FFB649; --c3: #44D7A5; --c4: #FF7A90; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1122; --surface: #131B33; --surface2: #1B2547; --ink: #E7ECFB; --muted: #9AA6CB; --line: #27325A;
  --accent: #7C98FF; --accent-ink: #0B1122; --accent-soft: #1F2C5E; --amber: #FFB649; --good: #44D7A5; --good-soft: #12342F; --bad: #FF7A90; --bad-soft: #3A1B28;
  --code-bg: #0A0F20; --code-line: #1E2748;
  --c1: #7C98FF; --c2: #FFB649; --c3: #44D7A5; --c4: #FF7A90; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-head); line-height: 1.2; text-wrap: balance; margin: 0; }
p { margin: 0 0 .8em; }
code { font-family: var(--font-mono); font-size: .88em; background: var(--surface2); padding: .1em .4em; border-radius: 5px; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- barra superior ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { height: var(--topbar-h); display: flex; align-items: center; gap: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; font: 700 17px var(--font-head); text-decoration: none; color: var(--ink); white-space: nowrap; }
.brand svg { width: 26px; height: 26px; flex: none; }
.progress { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; justify-content: center; }
.progress .bar { width: min(260px, 100%); height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.progress .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.progress span { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--surface2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.icon-btn:hover { background: var(--surface2); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.only-narrow { display: none; }

/* ---------- estructura ---------- */
.shell { display: grid; grid-template-columns: 300px minmax(0, 1fr); align-items: start; }
.sidebar { position: sticky; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--topbar-h) - env(safe-area-inset-top, 0px)); overflow: auto; padding: 20px 16px calc(28px + var(--dock-h)) max(16px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); background: var(--surface); }
.sidebar h2 { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px 6px; font-family: var(--font-body); font-weight: 700; }
.lesson-list { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 4px; }
.lesson-item { width: 100%; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 12px; padding: 10px 10px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: center; }
.lesson-item:hover:not(:disabled) { background: var(--surface2); }
.lesson-item[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.lesson-item:disabled { cursor: not-allowed; opacity: .55; }
.lesson-item .badge { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 700 13px var(--font-head); background: var(--surface2); color: var(--ink); }
.lesson-item[data-state="done"] .badge { background: var(--good); color: #fff; }
.lesson-item[data-state="skipped"] .badge { background: var(--amber); color: #fff; }
.lesson-item .badge svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.lesson-item b { display: block; font-size: 14px; font-weight: 600; line-height: 1.3; }
.lesson-item small { color: var(--muted); font-size: 12px; }
.soon { border: 1px dashed var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; color: var(--muted); }
.soon b { color: var(--ink); font-size: 14px; font-weight: 600; display: block; }
.soon small { font-size: 12px; display: block; line-height: 1.4; }
.side-foot { display: grid; gap: 8px; font-size: 12px; color: var(--muted); }
.side-foot .btn { justify-content: center; }
.main { min-width: 0; padding: 28px max(20px, env(safe-area-inset-right, 0px)) calc(60px + var(--dock-h)) clamp(20px, 4vw, 48px); }
.lesson { max-width: 860px; display: grid; gap: 26px; }
.lesson-head { display: grid; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); border: 1px solid transparent; }
.chip.mute { background: var(--surface2); color: var(--muted); }
.lesson h1 { font-size: clamp(28px, 4vw, 40px); letter-spacing: -.01em; }
.section { display: grid; gap: 12px; }
.section > h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-family: var(--font-body); font-weight: 700; display: flex; align-items: center; gap: 10px; }
.section > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.prose { max-width: 66ch; }
.formula { font: 600 17px var(--font-mono); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; overflow-x: auto; margin: 4px 0 14px; max-width: 100%; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.panel > header { margin-bottom: 12px; }
.panel > header h3 { font-size: 17px; }
.panel > header p { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
.callout { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
.callout.next { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.lesson-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* ---------- widgets ---------- */
.widget { display: grid; gap: 16px; }
.widget.cols { grid-template-columns: minmax(0, 260px) minmax(0, 1fr); align-items: start; }
.controls { display: grid; gap: 12px; align-content: start; }
.ctl { display: grid; gap: 4px; font-size: 13px; }
.ctl label, .ctl .lbl { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-weight: 500; }
.ctl output { font: 600 13px var(--font-mono); color: var(--ink); }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); }
.ctl select, .ctl input[type=text] { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 10px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.canvas-wrap { min-width: 0; }
canvas { display: block; max-width: 100%; border-radius: 10px; background: var(--surface); }
.readout { font: 500 13px/1.6 var(--font-mono); background: var(--surface2); border-radius: 10px; padding: 10px 12px; overflow-x: auto; }
.readout b { color: var(--accent); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; font: 500 13px var(--font-mono); color: var(--muted); }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
.graph-wrap { overflow-x: auto; }
.graph-wrap svg { width: 100%; min-width: 560px; height: auto; display: block; }
.g-edge { stroke: var(--muted); stroke-width: 1.6; fill: none; opacity: .5; }
.g-node rect { fill: var(--surface2); stroke: var(--line); stroke-width: 1.2; rx: 10; }
.g-node text { fill: var(--ink); font-family: var(--font-mono); text-anchor: middle; }
.g-node .nm { font-size: 12px; fill: var(--muted); }
.g-node .vl { font-size: 14px; font-weight: 700; }
.g-node .gr { font-size: 12px; fill: var(--accent); font-weight: 700; }
.g-node { opacity: .25; transition: opacity .3s; }
.g-node.on { opacity: 1; }
.g-node.on rect { stroke: var(--accent); }
.g-node .gr, .g-node .vl { opacity: 0; transition: opacity .3s; }
.g-node.has-v .vl, .g-node.has-g .gr { opacity: 1; }

/* ---------- editor, celdas y salida ---------- */
.cell { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
.cell-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.cell-bar .sp { flex: 1; }
.cell-bar .tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.editor { position: relative; background: var(--code-bg); }
.editor pre, .editor textarea { font-variant-ligatures: none; margin: 0; padding: 14px 16px; font: 13px/1.65 var(--font-mono); tab-size: 2; white-space: pre; overflow: auto; width: 100%; border: 0; border-radius: 0; letter-spacing: 0; }
.editor pre { position: absolute; inset: 0; pointer-events: none; color: var(--code-ink); overflow: hidden; }
.editor textarea { position: relative; display: block; background: transparent; color: transparent; caret-color: var(--code-ink); resize: none; outline: none; min-height: 120px; overflow-y: hidden; overflow-x: auto; }
.editor textarea::selection { background: rgba(124,152,255,.35); }
.editor:focus-within { box-shadow: inset 0 0 0 2px var(--accent); }
.tk-c { color: var(--code-muted); font-style: italic; } .tk-s { color: var(--code-str); } .tk-n { color: var(--code-num); } .tk-k { color: var(--code-kw); } .tk-f { color: var(--code-fn); }
.out { background: var(--code-bg); border-top: 1px solid var(--code-line); color: var(--code-ink); font: 13px/1.6 var(--font-mono); padding: 10px 16px; display: grid; gap: 6px; max-height: 420px; overflow: auto; }
.out:empty { display: none; }
.out .ln { white-space: pre-wrap; word-break: break-word; }
.out .err b, .dock-out .err b { display: block; font-weight: 600; }
.out .err small, .dock-out .err small { display: block; opacity: .7; font-size: 12px; margin-top: 2px; }
.out .res { color: var(--code-num); }
.out .err { color: #FF8FA3; }
.out .ech { color: var(--code-muted); }
.out .sys { color: var(--code-muted); font-style: italic; }
.out canvas { background: var(--surface); border-radius: 8px; justify-self: start; }
.tests { display: grid; gap: 6px; padding: 12px 16px; border-top: 1px solid var(--line); }
.tests:empty { display: none; }
.test { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; font-size: 14px; }
.test .ic { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; margin-top: 2px; }
.test.ok .ic { background: var(--good-soft); color: var(--good); }
.test.no .ic { background: var(--bad-soft); color: var(--bad); }
.test small { display: block; color: var(--muted); font-size: 13px; }
.win { background: var(--good-soft); color: var(--good); border-top: 1px solid var(--line); padding: 12px 16px; font-weight: 600; }
details.aid { border-top: 1px solid var(--line); padding: 10px 16px; }
details.aid summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
details.aid ol { margin: 8px 0 0; padding-left: 20px; color: var(--ink); font-size: 14px; }
details.aid pre { margin: 10px 0 0; background: var(--code-bg); color: var(--code-ink); border-radius: 10px; padding: 12px 14px; font: 12.5px/1.6 var(--font-mono); overflow: auto; }

/* ---------- consola ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--code-bg); color: var(--code-ink); border-top: 2px solid var(--accent); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: min(36vh, 340px); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -10px 30px rgba(0,0,0,.25); }
.dock-head { display: flex; align-items: center; gap: 10px; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 8px max(14px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--code-line); flex-wrap: wrap; }
.dock-head b { font: 700 14px var(--font-head); }
.dock-head .sp { flex: 1; }
.dock-head .st { font-size: 12px; color: var(--code-muted); display: flex; align-items: center; gap: 6px; }
.dock-head .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); display: inline-block; }
.dock-head .st.busy i { background: var(--c2); }
.dock .btn { background: transparent; color: var(--code-ink); border-color: var(--code-line); }
.dock .btn:hover { background: var(--code-line); }
.dock-out { overflow: auto; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); font: 13px/1.6 var(--font-mono); display: grid; gap: 4px; align-content: start; }
.dock-out .ln { white-space: pre-wrap; word-break: break-word; }
.dock-out .res { color: var(--code-num); } .dock-out .err { color: #FF8FA3; } .dock-out .ech { color: var(--code-muted); } .dock-out .sys { color: var(--code-muted); font-style: italic; }
.dock-out canvas { background: var(--surface); border-radius: 8px; justify-self: start; max-width: 100%; }
.dock-in { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; align-items: start; gap: 6px; padding: 8px max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px)); border-top: 1px solid var(--code-line); }
.dock-in span { font: 700 15px var(--font-mono); color: var(--accent); padding-top: 3px; }
.dock-in textarea { background: transparent; border: 0; outline: none; color: var(--code-ink); font: 13px/1.6 var(--font-mono); resize: none; min-height: 28px; max-height: 120px; width: 100%; padding: 3px 0; }

/* ---------- drawer en pantallas estrechas ---------- */
@media (max-width: 880px) {
  .only-narrow { display: grid; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; z-index: 45; left: 0; top: calc(var(--topbar-h) + env(safe-area-inset-top, 0px)); bottom: 0; width: min(330px, 90vw); height: auto; transform: translateX(-102%); transition: transform .25s ease; box-shadow: var(--shadow); }
  body.nav-open .sidebar { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 44; background: rgba(5,8,20,.5); }
  .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .widget.cols { grid-template-columns: minmax(0, 1fr); }
  .progress span.long { display: none; }
  .brand span { display: none; }
  .dock { height: min(52vh, 420px); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- versión para principiantes ---------- */
.tk-b { background: rgba(255,182,73,.22); color: #FFB649; border-radius: 4px; box-shadow: 0 0 0 1px rgba(255,182,73,.5); }
.btn.big { padding: 11px 20px; font-size: 15px; border-radius: 12px; }
.lead { font-size: 18px; max-width: 54ch; color: var(--muted); margin: 0; }
.goal { margin: 0; font-size: 16px; }
.goal b { color: var(--accent); }
.home-btn { width: 100%; justify-content: center; margin-bottom: 14px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.steps > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 4px; }
.steps b { font-family: var(--font-head); font-size: 16px; }
.steps span { color: var(--muted); font-size: 14px; }
.mods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.mod { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.mod .chip { justify-self: start; }
.mod h3 { font-size: 18px; }
.mod p { margin: 0; color: var(--muted); font-size: 14px; }
.mod ul { margin: 0; padding-left: 18px; font-size: 14px; display: grid; gap: 2px; }
.mod li small, .modp { color: var(--muted); }
.modp { font-size: 12px; font-weight: 600; }
.note { color: var(--muted); font-size: 14px; max-width: 66ch; }
.example { display: grid; gap: 8px; }
.ex-note { margin: 0; font-size: 14px; color: var(--muted); }
.hints { display: grid; gap: 8px; padding: 0 16px; }
.hints:not(:empty) { padding: 12px 16px 4px; }
.hint { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.toast { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 70; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); }
@media (max-width: 880px) { .steps, .mods { grid-template-columns: minmax(0, 1fr); } .lead { font-size: 16px; } }

</style>

<header class="topbar">
  <div class="topbar-in">
    <button id="menuBtn" class="icon-btn only-narrow" aria-label="Mostrar lecciones"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="brand" href="#" aria-label="Laboratorio Neuronal">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="6" cy="8" r="3" fill="var(--c2)"/><circle cx="6" cy="24" r="3" fill="var(--c2)"/><circle cx="16" cy="16" r="4" fill="var(--accent)"/><circle cx="27" cy="16" r="3" fill="var(--c3)"/><path d="M9 9l4.5 5M9 23l4.5-5M20 16h4" stroke="var(--muted)" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Laboratorio Neuronal</span>

function kernelLib(G) {
  // ------------------------------------------------------------ formato de salida
  function num(x) {
    if (Number.isInteger(x)) return String(x);

  function fmt(v, depth = 0) {

    if (typeof v === "boolean") return String(v);
    if (typeof v === "function") return "ƒ " + (v.name || "anónima");
    if (v instanceof Error) return v.name + ": " + v.message;
    if (v && typeof v.toString === "function" && v.constructor && v.constructor.name === "Value") return v.toString();

      return "{ " + ks.map((k) => k + ": " + fmt(v[k], depth + 1)).join(", ") + (Object.keys(v).length > 12 ? ", …" : "") + " }";
    }

  }
  const print = (...a) => G.__emit({ type: "log", text: a.map((x) => fmt(x)).join(" ") });

  // ------------------------------------------------------------ azar reproducible
  function rng(seed = 1) {
    let a = seed >>> 0;
    const next = () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

      let u = 0;
      while (u === 0) u = next();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * next());

  // ------------------------------------------------------------ álgebra con arreglos
  const range = (n) => Array.from({ length: n }, (_, i) => i);
  const linspace = (a, b, n) => Array.from({ length: n }, (_, i) => (n === 1 ? a : a + ((b - a) * i) / (n - 1)));
  const sum = (v) => v.reduce((s, x) => s + x, 0);
  const mean = (v) => sum(v) / v.length;
  const std = (v) => { const m = mean(v); return Math.sqrt(mean(v.map((x) => (x - m) ** 2))); };
  const dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);

  const zeros = (r, c) => Array.from({ length: r }, () => new Array(c).fill(0));
  const transpose = (A) => A[0].map((_, j) => A.map((row) => row[j]));
  function matmul(A, B) {
    const n = A.length, k = B.length, m = B[0].length;

    for (let i = 0; i < n; i++) for (let p = 0; p < k; p++) { const a = A[i][p]; if (a !== 0) for (let j = 0; j < m; j++) C[i][j] += a * B[p][j]; }

  function randn(r, c, seed = 0) { const g = rng(seed); return Array.from({ length: r }, () => Array.from({ length: c }, () => g.normal())); }

    const m = Math.max(...v);

  // ------------------------------------------------------------ autograd escalar (micrograd)
  class Value {
    constructor(data, prev = [], op = "") { this.data = data; this.grad = 0; this._prev = prev; this._op = op; this._back = () => {}; }
    static w(x) { return x instanceof Value ? x : new Value(x); }
    add(o) { o = Value.w(o); const out = new Value(this.data + o.data, [this, o], "+"); out._back = () => { this.grad += out.grad; o.grad += out.grad; }; return out; }
    mul(o) { o = Value.w(o); const out = new Value(this.data * o.data, [this, o], "*"); out._back = () => { this.grad += o.data * out.grad; o.grad += this.data * out.grad; }; return out; }
    pow(k) { const out = new Value(this.data ** k, [this], "**" + k); out._back = () => { this.grad += k * this.data ** (k - 1) * out.grad; }; return out; }
    neg() { return this.mul(-1); }
    sub(o) { return this.add(Value.w(o).neg()); }
    div(o) { return this.mul(Value.w(o).pow(-1)); }
    exp() { const out = new Value(Math.exp(this.data), [this], "exp"); out._back = () => { this.grad += out.data * out.grad; }; return out; }
    log() { const out = new Value(Math.log(this.data), [this], "log"); out._back = () => { this.grad += (1 / this.data) * out.grad; }; return out; }
    tanh() { const t = Math.tanh(this.data); const out = new Value(t, [this], "tanh"); out._back = () => { this.grad += (1 - t * t) * out.grad; }; return out; }
    relu() { const out = new Value(Math.max(0, this.data), [this], "relu"); out._back = () => { this.grad += (out.data > 0 ? 1 : 0) * out.grad; }; return out; }
    sigmoid() { const s = 1 / (1 + Math.exp(-this.data)); const out = new Value(s, [this], "sigmoid"); out._back = () => { this.grad += s * (1 - s) * out.grad; }; return out; }
    backward() {
      const topo = [], seen = new Set();
      const build = (v) => { if (!seen.has(v)) { seen.add(v); v._prev.forEach(build); topo.push(v); } };
      build(this);
      this.grad = 1;
      for (let i = topo.length - 1; i >= 0; i--) topo[i]._back();
    }
    toString() { return `Value(data=${num(this.data)}, grad=${num(this.grad)})`; }
  }
  const V = (x) => Value.w(x);
  /** Compara el gradiente de autodiff con la derivada numérica. f recibe Values y devuelve un Value. */
  function gradcheck(f, xs, h = 1e-6) {
    const vs = xs.map((x) => new Value(x));
    f(...vs).backward();
    let worst = 0;
    xs.forEach((x, i) => {
      const p = xs.slice(), q = xs.slice();
      p[i] += h; q[i] -= h;
      const num_ = (f(...p.map((z) => new Value(z))).data - f(...q.map((z) => new Value(z))).data) / (2 * h);
      worst = Math.max(worst, Math.abs(vs[i].grad - num_) / Math.max(1e-12, Math.abs(vs[i].grad) + Math.abs(num_)));
    });
    return worst;
  }

  // ------------------------------------------------------------ datos sintéticos
  function moons(n = 200, ruido = 0.1, seed = 0) {
    const g = rng(seed), X = [], y = [];
    for (let i = 0; i < n; i++) {
      const c = i % 2, t = g.next() * Math.PI;
      const p = c === 0 ? [Math.cos(t), Math.sin(t)] : [1 - Math.cos(t), 0.5 - Math.sin(t)];
      X.push([p[0] + ruido * g.normal(), p[1] + ruido * g.normal()]); y.push(c);
    }
    return { X, y };
  }
  function spirals(nPorClase = 100, clases = 3, ruido = 0.2, seed = 0) {
    const g = rng(seed), X = [], y = [];
    for (let k = 0; k < clases; k++) for (let i = 0; i < nPorClase; i++) {
      const r = i / (nPorClase - 1), t = k * 4 + (i / (nPorClase - 1)) * 4 + ruido * g.normal();
      X.push([r * Math.sin(t), r * Math.cos(t)]); y.push(k);
    }
    return { X, y };
  }
  function xorData(n = 200, ruido = 0.15, seed = 0) {
    const g = rng(seed), X = [], y = [];
    for (let i = 0; i < n; i++) { const a = g.next() < 0.5 ? -1 : 1, b = g.next() < 0.5 ? -1 : 1; X.push([a * 0.7 + ruido * g.normal(), b * 0.7 + ruido * g.normal()]); y.push(a * b > 0 ? 1 : 0); }
    return { X, y };
  }

  // ------------------------------------------------------------ MLP vectorizado con backprop manual
  class MLP {
    constructor(dims, opts = {}) {
      this.dims = dims; this.act = opts.act || "tanh"; this.optim = opts.optim || "sgd"; this.t = 0;
      const g = rng(opts.seed ?? 0);
      this.W = []; this.b = []; this.mW = []; this.vW = []; this.mb = []; this.vb = [];
      for (let l = 0; l < dims.length - 1; l++) {
        const fi = dims[l], fo = dims[l + 1];
        const sd = this.act === "relu" ? Math.sqrt(2 / fi) : Math.sqrt(1 / fi) * (this.act === "tanh" ? 5 / 3 : 1);
        this.W.push(Float64Array.from({ length: fi * fo }, () => g.normal() * sd));
        this.b.push(new Float64Array(fo));
        this.mW.push(new Float64Array(fi * fo)); this.vW.push(new Float64Array(fi * fo));
        this.mb.push(new Float64Array(fo)); this.vb.push(new Float64Array(fo));
      }
    }
    nParams() { return this.W.reduce((s, w, i) => s + w.length + this.b[i].length, 0); }
    _f(z) { return this.act === "relu" ? (z > 0 ? z : 0) : this.act === "sigmoid" ? 1 / (1 + Math.exp(-z)) : Math.tanh(z); }
    _df(z, a) { return this.act === "relu" ? (z > 0 ? 1 : 0) : this.act === "sigmoid" ? a * (1 - a) : 1 - a * a; }
    _flat(X) { const n = X.length, d = X[0].length, F = new Float64Array(n * d); for (let i = 0; i < n; i++) for (let j = 0; j < d; j++) F[i * d + j] = X[i][j]; return F; }
    _forward(F, n) {

      for (let l = 0; l < L; l++) {
        const fi = this.dims[l], fo = this.dims[l + 1], A = as[l], W = this.W[l], b = this.b[l];
        const Z = new Float64Array(n * fo);
        for (let i = 0; i < n; i++) for (let j = 0; j < fo; j++) { let s = b[j]; for (let p = 0; p < fi; p++) s += A[i * fi + p] * W[p * fo + j]; Z[i * fo + j] = s; }
        zs.push(Z);
        if (l < L - 1) { const O = new Float64Array(n * fo); for (let q = 0; q < O.length; q++) O[q] = this._f(Z[q]); as.push(O); } else as.push(Z);
      }

    }
    _softmax(Z, n, k) {
      const P = new Float64Array(n * k);
      for (let i = 0; i < n; i++) { let m = -Infinity; for (let j = 0; j < k; j++) m = Math.max(m, Z[i * k + j]); let s = 0; for (let j = 0; j < k; j++) { const e = Math.exp(Z[i * k + j] - m); P[i * k + j] = e; s += e; } for (let j = 0; j < k; j++) P[i * k + j] /= s; }
      return P;
    }
    predict(X) {
      const n = X.length, k = this.dims[this.dims.length - 1], { as } = this._forward(this._flat(X), n), Z = as[as.length - 1], out = [];
      for (let i = 0; i < n; i++) { let bj = 0; for (let j = 1; j < k; j++) if (Z[i * k + j] > Z[i * k + bj]) bj = j; out.push(bj); }
      return out;
    }
    evaluate(X, y) {
      const n = X.length, k = this.dims[this.dims.length - 1], { as } = this._forward(this._flat(X), n), P = this._softmax(as[as.length - 1], n, k);
      let loss = 0, ok = 0;
      for (let i = 0; i < n; i++) { loss -= Math.log(P[i * k + y[i]] + 1e-12); let bj = 0; for (let j = 1; j < k; j++) if (P[i * k + j] > P[i * k + bj]) bj = j; if (bj === y[i]) ok++; }
      return { loss: loss / n, acc: ok / n };
    }
    /** Un paso de descenso con todo el lote. Devuelve { loss, acc } ANTES de actualizar. */
    trainStep(X, y, lr = 0.1, opts = {}) {
      const n = X.length, k = this.dims[this.dims.length - 1], L = this.W.length, wd = opts.weightDecay || 0;
      const { as, zs } = this._forward(this._flat(X), n), P = this._softmax(as[L], n, k);
      let loss = 0, ok = 0;
      let dZ = new Float64Array(n * k);
      for (let i = 0; i < n; i++) {
        loss -= Math.log(P[i * k + y[i]] + 1e-12);
        let bj = 0; for (let j = 1; j < k; j++) if (P[i * k + j] > P[i * k + bj]) bj = j; if (bj === y[i]) ok++;
        for (let j = 0; j < k; j++) dZ[i * k + j] = (P[i * k + j] - (j === y[i] ? 1 : 0)) / n;
      }
      this.t++;
      for (let l = L - 1; l >= 0; l--) {
        const fi = this.dims[l], fo = this.dims[l + 1], A = as[l], W = this.W[l];
        const dW = new Float64Array(fi * fo), db = new Float64Array(fo);
        for (let i = 0; i < n; i++) for (let j = 0; j < fo; j++) { const d = dZ[i * fo + j]; db[j] += d; for (let p = 0; p < fi; p++) dW[p * fo + j] += A[i * fi + p] * d; }
        let dA = null;
        if (l > 0) {
          dA = new Float64Array(n * fi);
          for (let i = 0; i < n; i++) for (let p = 0; p < fi; p++) { let s = 0; for (let j = 0; j < fo; j++) s += dZ[i * fo + j] * W[p * fo + j]; dA[i * fi + p] = s * this._df(zs[l - 1][i * fi + p], A[i * fi + p]); }
        }
        this._update(l, dW, db, lr, wd);
        dZ = dA;
      }
      return { loss: loss / n, acc: ok / n };
    }
    _update(l, dW, db, lr, wd) {
      const W = this.W[l], b = this.b[l];
      if (this.optim === "adam") {
        const b1 = 0.9, b2 = 0.999, c1 = 1 - b1 ** this.t, c2 = 1 - b2 ** this.t;
        for (let q = 0; q < W.length; q++) { this.mW[l][q] = b1 * this.mW[l][q] + (1 - b1) * dW[q]; this.vW[l][q] = b2 * this.vW[l][q] + (1 - b2) * dW[q] * dW[q]; W[q] -= lr * (this.mW[l][q] / c1 / (Math.sqrt(this.vW[l][q] / c2) + 1e-8) + wd * W[q]); }
        for (let q = 0; q < b.length; q++) { this.mb[l][q] = b1 * this.mb[l][q] + (1 - b1) * db[q]; this.vb[l][q] = b2 * this.vb[l][q] + (1 - b2) * db[q] * db[q]; b[q] -= lr * (this.mb[l][q] / c1 / (Math.sqrt(this.vb[l][q] / c2) + 1e-8)); }
      } else if (this.optim === "momentum") {
        for (let q = 0; q < W.length; q++) { this.mW[l][q] = 0.9 * this.mW[l][q] + dW[q]; W[q] -= lr * (this.mW[l][q] + wd * W[q]); }
        for (let q = 0; q < b.length; q++) { this.mb[l][q] = 0.9 * this.mb[l][q] + db[q]; b[q] -= lr * this.mb[l][q]; }
      } else {
        for (let q = 0; q < W.length; q++) W[q] -= lr * (dW[q] + wd * W[q]);
        for (let q = 0; q < b.length; q++) b[q] -= lr * db[q];
      }
    }
  }
  /** Rejilla de predicciones del modelo para dibujar la frontera de decisión. */
  function gridPredict(model, data, res = 48) {
    const xs = data.X.map((p) => p[0]), ys = data.X.map((p) => p[1]);
    const pad = 0.25, x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad, y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
    const pts = [];
    for (let j = 0; j < res; j++) for (let i = 0; i < res; i++) pts.push([x0 + ((x1 - x0) * (i + 0.5)) / res, y1 - ((y1 - y0) * (j + 0.5)) / res]);
    return { grid: model.predict(pts), res, bounds: [x0, x1, y0, y1] };
  }
  function plotBoundary(model, data, titulo = "Frontera de decisión") {
    const g = gridPredict(model, data);
    plot({ type: "boundary", title: titulo, grid: g.grid, res: g.res, bounds: g.bounds, points: data.X.map((p, i) => [p[0], p[1], data.y[i]]) });
  }

  // ------------------------------------------------------------ ayuda
  function ayuda() {
    print([
      "Funciones disponibles en la consola y en las celdas:",
      "  print(...)  plot({type:'line'|'scatter'|'heat'|'bar', ...})  plotBoundary(modelo, datos)",
      "  Value(x)    autograd escalar: a.add(b) .sub .mul .div .pow(k) .exp() .log() .tanh() .relu() .sigmoid() .backward()",
      "  V(x)        envuelve un número en Value      gradcheck(f, [x1, x2, ...])",
      "  matmul(A,B) transpose(A) zeros(r,c) randn(r,c,seed) softmax(v) dot(a,b) argmax(v)",
      "  range(n) linspace(a,b,n) sum(v) mean(v) std(v)       rng(seed) → { next(), normal(), int(n) }",
      "  moons(n,ruido,seed) spirals(nPorClase,clases,ruido,seed) xorData(n,ruido,seed)",
      "  new MLP([2,16,3], { act:'tanh'|'relu'|'sigmoid', optim:'sgd'|'momentum'|'adam', seed })",
      "      .trainStep(X, y, lr) → {loss, acc}   .evaluate(X, y)   .predict(X)   .nParams()",
      "Las variables que declares con const o let se conservan entre celdas (como en un cuaderno).",
    ].join("\n"));
  }

  // ------------------------------------------------------------ ejecución
  function prep(code) {
    return code
      .replace(/^(const|let)\s/gm, "var ")
      .replace(/^class\s+([A-Za-z_$][\w$]*)/gm, "var $1 = class $1");
  }
  G.__handle = function (msg) {
    if (msg.type === "run") {
      try {
        const r = (0, eval)(prep(msg.code));
        G.__emit({ type: "result", id: msg.id, ok: true, has: r !== undefined, value: r === undefined ? "" : fmt(r) });
      } catch (e) {
        G.__emit({ type: "result", id: msg.id, ok: false, error: e && e.name ? e.name + ": " + e.message : String(e) });
      }
    } else if (msg.type === "check") {
      let results;
      try { const fn = (0, eval)("(" + msg.code + ")"); results = fn(); }
      catch (e) { results = [{ name: "Preparación del reto", ok: false, msg: String(e && e.message ? e.message : e) }]; }
      G.__emit({ type: "check", id: msg.id, results });
    }
  };

  Object.assign(G, { fmt, num, print, plot, rng, range, linspace, sum, mean, std, dot, argmax, zeros, transpose, matmul, randn, softmax,
    Value, V, gradcheck, moons, spirals, xorData, MLP, gridPredict, plotBoundary, ayuda });
  if (G.console) { G.console.log = print; G.console.info = print; G.console.warn = print; G.console.error = (...a) => print("⚠", ...a); }
}
if (typeof module !== "undefined") module.exports = kernelLib;

<script>
/* pyinterp.js — intérprete de un subconjunto de Python 3, escrito desde cero, sin eval ni dependencias.
   Cubre lo que usa un curso para empezar: variables, números, texto, listas, tuplas, diccionarios,
   if/elif/else, for, while, def, lambda, comprensiones, f-strings, import math/random y las funciones
   integradas más comunes. Lo que no soporta (clases, try/except, with, etc.) avisa con un error claro.
   Fidelidad: int exactos (BigInt), repr de floats como CPython, random con el mismo generador (MT19937). */
(function (root) {

  class PyError extends Error {

  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
  applyTheme(store.get("theme", null));
  $("#themeBtn").addEventListener("click", () => { const cur = document.documentElement.getAttribute("data-theme"), dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches, t = dark ? "light" : "dark"; store.set("theme", t); applyTheme(t); });

  // ---- consola de Python (REPL)
  const dock = $("#dock"), dOut = $("#dockOut"), dIn = $("#dockIn"), dSt = $("#dockSt"), hist = [], hp = { i: 0 };
  function setDock(open) { dockOpen = open; dock.hidden = !open; document.body.style.setProperty("--dock-h", open ? dock.offsetHeight + "px" : "0px"); $("#consoleBtn").setAttribute("aria-pressed", String(open)); if (open) { dIn.focus(); redrawAll(); if (!dOut.children.length) welcome(); } }
  $("#consoleBtn").addEventListener("click", () => setDock(!dockOpen));
  $("#dockClose").addEventListener("click", () => setDock(false));
  $("#dockClear").addEventListener("click", () => dOut.replaceChildren());
  $("#dockReset").addEventListener("click", async () => { await kernel.reset(); addLine(dOut, "Python reiniciado: se borraron las variables.", "sys"); });
  $("#dockHelp").addEventListener("click", () => submit("ayuda()"));
  window.addEventListener("resize", () => { if (dockOpen) document.body.style.setProperty("--dock-h", dock.offsetHeight + "px"); });
  kernel.busyCb = (b) => { dSt.classList.toggle("busy", b); dSt.lastChild.textContent = b ? "ejecutando…" : "Python listo"; };
  function welcome() { addLine(dOut, "Consola de Python. Comparte variables con las lecciones, como un cuaderno.", "sys"); addLine(dOut, "Escribe algo y pulsa Enter. Prueba: 2 + 2  ·  import math  ·  math.sqrt(16)  ·  ayuda()", "sys"); }
  async function submit(code) {
    code = code.replace(/\s+$/, ""); if (!code.trim()) return; hist.push(code); hp.i = hist.length; addLine(dOut, "› " + code.split("\n").join("\n  "), "ech");
    const r = await kernel.run(code, sinkFor(dOut), { repl: true });
    if (!r.ok) addError(dOut, r.err, code);
  }
  dIn.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      const v = dIn.value, lines = v.split("\n"), last = lines[lines.length - 1];
      if (/:\s*$/.test(last) || (lines.length > 1 && last.trim() !== "")) { e.preventDefault(); const ind = (last.match(/^\s*/) || [""])[0] + (/:\s*$/.test(last) ? "    " : ""); dIn.setRangeText("\n" + ind, dIn.selectionStart, dIn.selectionEnd, "end"); dIn.dispatchEvent(new Event("input")); return; }
      e.preventDefault(); dIn.value = ""; dIn.style.height = "auto"; submit(v);
    } else if (e.key === "Tab") { e.preventDefault(); dIn.setRangeText("    ", dIn.selectionStart, dIn.selectionEnd, "end"); }
    else if (e.key === "ArrowUp" && !dIn.value.includes("\n") && hp.i > 0) { e.preventDefault(); dIn.value = hist[--hp.i]; }
    else if (e.key === "ArrowDown" && !dIn.value.includes("\n") && hp.i < hist.length) { e.preventDefault(); hp.i++; dIn.value = hp.i === hist.length ? "" : hist[hp.i]; }
  });
  dIn.addEventListener("input", () => { dIn.style.height = "auto"; dIn.style.height = Math.min(140, dIn.scrollHeight) + "px"; });
  window.__ln = { kernel, LESSONS, state, go, show, setDock };   // para depuración desde la consola del navegador

  // ---- arranque
  function route() { const hsh = location.hash, m = hsh.match(/^#leccion-([a-z]+)$/); if (m && LESSONS.some((l) => l.id === m[1])) show(m[1]); else if (hsh === "#inicio" || !LESSONS.some((l) => isDone(l.id))) renderHome(); else show(firstOpen().id); }
  window.addEventListener("hashchange", () => { const m = location.hash.match(/^#leccion-([a-z]+)$/); if (m && m[1] !== state.current && LESSONS.some((l) => l.id === m[1])) show(m[1]); else if (location.hash === "#inicio" && state.current !== "inicio") renderHome(); });
  route();
})();

</script>
